[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tslgen"
version = "0.1.0a1"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "lark>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tslgen*"]

[tool.setuptools.package-data]
tslgen = ["syntax/grammar/*.lark"]
