[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tslc"
version = "0.1.0a1"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "lark>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tslc*"]

[tool.setuptools.package-data]
tslc = ["syntax/grammar/*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep scratch on the workspace (9p host mount), not /tmp (overlay grows the WSL VHDX).
addopts = "--basetemp=tslctmp/pytest"
