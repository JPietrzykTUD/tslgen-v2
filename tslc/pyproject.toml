[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tslc"
version = "0.1.0a1"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "lark>=1.3",
]

[project.optional-dependencies]
editor = [
  "pygls>=2.1,<3",
  "lsprotocol>=2025,<2026",
]

[project.scripts]
tslc = "tslc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tslc*"]

[tool.setuptools.package-data]
# `*` does not match dotfiles, so the `.clang-format` asset is listed explicitly — otherwise it
# would be absent from an installed wheel and `asset(".clang-format")` would fail.
tslc = ["syntax/grammar/*.lark", "backend/assets/*", "backend/assets/.clang-format"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep scratch on the workspace (9p host mount), not /tmp (overlay grows the WSL VHDX).
addopts = "--basetemp=tslctmp/pytest"

[tool.mypy]
python_version = "3.14"
files = [
  "src/tslc",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
cache_dir = "../tslctmp/mypy-cache"
