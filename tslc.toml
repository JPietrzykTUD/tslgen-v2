[tslc]
sources = ["tsldata"]
machine_profiles = "supplementary/buildsystem/machine_profiles.json"
backends = ["cpp", "rust"]
authoring_profiles = ["scalar", "avx2"]
output_root = "tslctmp/generated"

[tslc.backend_profiles]
rust = [
  "scalar",
  "sse",
  "sse2",
  "sse3",
  "avx",
  "avx2",
  "knl",
  "kml",
  "skylake",
  "cannonlake",
  "cascadelake",
  "cooperlake",
  "icelake_rockerlake",
  "tigerlake",
  "zen4",
  "sapphire_emerald_granite_rapids",
  "zen5",
  "neon",
  "wasm32-simd128",
]

[tslc.rust_package]
name = "tsl"
version = "1.0.0"
description = "Generated cross-platform SIMD primitives and data-parallel algorithms"
edition = "2021"
rust_version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/JPietrzykTUD/tslgen-v2"
documentation = "https://docs.rs/tsl"
readme = "README.md"

# Committed repo-canonical tool roles live in [tslc.tools] below. Personal,
# host-specific overrides use these tables and stay uncommitted.
# [tslc.toolchains.cpp]
# compiler = "clang++"
# target = "aarch64-linux-gnu"
# linker = "aarch64-linux-gnu-g++"
# [tslc.runners]
# qemu-aarch64 = "/usr/bin/qemu-aarch64"

[tslc.tools]
# Canonical devcontainer locations for role-specific compilers; override or
# remove per host. Missing tools become recorded verification skips.
oneapi-cpp = "/opt/intel/oneapi/compiler/2025.0/bin/icpx"
wasi-cpp = "/opt/wasi-sdk/bin/clang++"
riscv-cpp = "/usr/bin/riscv64-linux-gnu-g++"
