name: Build TSLc CI image
description: Set up Docker Buildx and build, load, or push the TSLc CI image.

inputs:
  image:
    description: Docker image tag to build.
    required: true
  cache-scope:
    description: GitHub Actions build cache scope.
    required: false
    default: tslc-ci-image
  load:
    description: Load the image into the local Docker daemon.
    required: false
    default: "true"
  push:
    description: Push the image to its registry.
    required: false
    default: "false"
  reuse-existing:
    description: Skip the build when the tagged registry image already exists.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check for an existing image
      id: existing
      if: inputs['reuse-existing'] == 'true'
      shell: bash
      run: |
        if docker manifest inspect "${{ inputs.image }}" >/dev/null 2>&1; then
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Reusing ${{ inputs.image }}"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      if: steps.existing.outputs.present != 'true'
      uses: docker/setup-buildx-action@v4

    - name: Build CI image
      if: steps.existing.outputs.present != 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ github.workspace }}
        file: ${{ github.workspace }}/.devcontainer/Dockerfile
        tags: ${{ inputs.image }}
        load: ${{ inputs.load }}
        push: ${{ inputs.push }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
