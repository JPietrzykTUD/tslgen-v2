name: Generated Value Tests

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tslc-generated-values-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute image tag
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          echo "image=ghcr.io/${owner}/${name}-tslc-ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: ./.github/actions/build-ci-image
        with:
          image: ${{ steps.image.outputs.image }}
          load: "false"
          push: "true"

  profile-shards:
    name: Compute profile shards
    runs-on: ubuntu-latest
    outputs:
      profile_shards: ${{ steps.shards.outputs.profile_shards }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute generated profile shards
        id: shards
        run: |
          profile_shards="$(
            jq -c -f .github/scripts/profile_shards.jq \
              supplementary/buildsystem/machine_profiles.json
          )"
          echo "profile_shards=${profile_shards}" >> "$GITHUB_OUTPUT"

  generated-value-tests:
    name: Generated value tests (${{ matrix.backend }} / ${{ matrix.profile_shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - ci-image
      - profile-shards

    strategy:
      fail-fast: false
      matrix:
        backend: [cpp, rust]
        profile_shard: ${{ fromJson(needs['profile-shards'].outputs.profile_shards) }}

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}/docker-pull.log" \
            docker pull "${TSLC_CI_IMAGE}"

      - name: Run generated value-test shard
        run: |
          summary_file="tslctmp/ci-logs/generated-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}/summary.md"
          # Intel SDE/Pin needs ptrace when running generated x86 value-test binaries.
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}/value-tests.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              --cap-add=SYS_PTRACE \
              --security-opt seccomp=unconfined \
              -e TSLC_BACKENDS="${{ matrix.backend }}" \
              -e TSLC_PROFILES="${{ matrix.profile_shard.profiles }}" \
              -e TSLC_CI_OUTPUT="./tslctmp/ci-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}" \
              -e TSLC_SUMMARY_FILE="./${summary_file}" \
              -e TSLC_SDE="/opt/intel-sde/sde64" \
              -e TSLC_QEMU_AARCH64="/usr/bin/qemu-aarch64" \
              -- \
              bash -lc '
                set -e
                trap "rm -rf \"${TSLC_CI_OUTPUT}\" tslctmp/toolchain-preflight tslctmp/zig-local-cache tslctmp/zig-global-cache" EXIT
                ./dev.sh test \
                  --backends "${TSLC_BACKENDS}" \
                  --profiles "${TSLC_PROFILES}" \
                  --output-root "${TSLC_CI_OUTPUT}"
              '

      - name: Append generated value-test summary
        if: always()
        run: |
          summary_file="tslctmp/ci-logs/generated-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}/summary.md"
          if [[ -s "$summary_file" ]]; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Generated value-test summary"
              echo
              echo "No summary was produced for ${{ matrix.backend }} / ${{ matrix.profile_shard.name }}. Check the uploaded logs for setup failures."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated value-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-generated-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}
          path: tslctmp/ci-logs/generated-values-${{ matrix.backend }}-${{ matrix.profile_shard.name }}
          if-no-files-found: ignore
          retention-days: 14
