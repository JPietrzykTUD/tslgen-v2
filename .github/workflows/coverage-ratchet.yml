name: Coverage Ratchet

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tslc-coverage-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine CI scope
    uses: ./.github/workflows/ci-scope.yml

  coverage-ratchet:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - scope
    if: needs.scope.outputs.coverage == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Install Python dependencies
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/coverage-ratchet/install.log" \
            bash -lc '
              set -e
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pip install --no-deps -e ./tslc
            '

      - name: Run coverage ratchet
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/coverage-ratchet/ratchet.log" \
            bash dev.sh ratchet

      - name: Run benchmark coverage ratchet
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/coverage-ratchet/benchmark-ratchet.log" \
            bash dev.sh benchmark-ratchet

      - name: Run Rust benchmark coverage ratchet
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/coverage-ratchet/benchmark-rust-ratchet.log" \
            bash dev.sh benchmark-ratchet --backend rust

      - name: Upload coverage ratchet logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-coverage-ratchet
          path: tslctmp/ci-logs/coverage-ratchet
          if-no-files-found: ignore
          retention-days: 14

  required-coverage:
    name: Required coverage CI
    runs-on: ubuntu-latest
    needs:
      - scope
      - coverage-ratchet
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify selected jobs passed
        run: |
          bash .github/scripts/require_ci_results.sh \
            scope true "${{ needs.scope.result }}" \
            coverage-ratchet "${{ needs.scope.outputs.coverage }}" "${{ needs['coverage-ratchet'].result }}"
