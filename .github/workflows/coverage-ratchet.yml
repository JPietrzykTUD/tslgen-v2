name: Coverage Ratchet

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tslc-coverage-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine CI scope
    uses: ./.github/workflows/ci-scope.yml

  coverage-ratchet:
    name: Coverage ratchet (${{ matrix.ratchet }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - scope
    if: needs.scope.outputs.coverage == 'true'

    strategy:
      fail-fast: false
      matrix:
        ratchet:
          - coverage
          - target-support
          - implementation-quality
          - benchmark
          - benchmark-rust

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Install Python dependencies
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/coverage-ratchet-${{ matrix.ratchet }}/install.log" \
            bash -lc '
              set -e
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pip install --no-deps -e ./tslc
            '

      - name: Run ${{ matrix.ratchet }} ratchet
        env:
          TSLC_RATCHET: ${{ matrix.ratchet }}
        run: |
          set -euo pipefail
          case "${TSLC_RATCHET}" in
            coverage) command=(bash dev.sh ratchet) ;;
            target-support) command=(bash dev.sh target-ratchet --require-complete) ;;
            implementation-quality) command=(bash dev.sh implementation-ratchet) ;;
            benchmark) command=(bash dev.sh benchmark-ratchet) ;;
            benchmark-rust) command=(bash dev.sh benchmark-ratchet --backend rust) ;;
            *) echo "unknown ratchet shard: ${TSLC_RATCHET}" >&2; exit 2 ;;
          esac
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/coverage-ratchet-${TSLC_RATCHET}/ratchet.log" \
            "${command[@]}"

      - name: Upload coverage ratchet logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-coverage-ratchet-${{ matrix.ratchet }}
          path: tslctmp/ci-logs/coverage-ratchet-${{ matrix.ratchet }}
          if-no-files-found: ignore
          retention-days: 14

  required-coverage:
    name: Required coverage CI
    runs-on: ubuntu-latest
    needs:
      - scope
      - coverage-ratchet
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify selected jobs passed
        run: |
          bash .github/scripts/require_ci_results.sh \
            scope true "${{ needs.scope.result }}" \
            coverage-ratchet "${{ needs.scope.outputs.coverage }}" "${{ needs['coverage-ratchet'].result }}"
