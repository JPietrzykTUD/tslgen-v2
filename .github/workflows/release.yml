name: TSL Generated Library Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate tag metadata to validate in a non-publishing dry run
        required: true
        default: v1.0.0-rc.1

permissions:
  contents: read

concurrency:
  group: tslc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release identity
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      source_epoch: ${{ steps.identity.outputs.source_epoch }}
    steps:
      - name: Check out immutable source identity
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify tag, versions, MSRV, and release notes
        id: identity
        env:
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          args=(metadata --tag "${REQUESTED_TAG}")
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            args+=(--commit "${GITHUB_SHA}" --verify-tag)
          fi
          python .github/scripts/release_production.py "${args[@]}"
          echo "release_tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"
          echo "source_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"

  python:
    name: Required Python and PIVOT gates
    needs: preflight
    uses: ./.github/workflows/python.yml
    permissions:
      contents: read
    secrets: inherit

  coverage:
    name: Required coverage gates
    needs: preflight
    uses: ./.github/workflows/coverage-ratchet.yml
    permissions:
      contents: read
    secrets: inherit

  generated:
    name: Required generated C++ and Rust gates
    needs: preflight
    uses: ./.github/workflows/generated-values.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  package:
    name: Required package and documentation gates
    needs: preflight
    uses: ./.github/workflows/generated-package.yml
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    secrets: inherit

  editor:
    name: Required editor and runtime-package gates
    needs: preflight
    uses: ./.github/workflows/editor.yml
    permissions:
      contents: read
    secrets: inherit

  stage-release:
    name: Stage and verify exact release assets
    runs-on: ubuntu-latest
    needs:
      - preflight
      - python
      - coverage
      - generated
      - package
      - editor
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v5

      - name: Download generated library archive
        uses: actions/download-artifact@v8
        with:
          name: tsl-generated-${{ github.sha }}
          path: tslctmp/release-input/generated

      - name: Download generated documentation archive
        uses: actions/download-artifact@v8
        with:
          name: tsl-docs-${{ github.sha }}
          path: tslctmp/release-input/docs

      - name: Download native editor packages
        uses: actions/download-artifact@v8
        with:
          pattern: tsl-language-support-*
          path: tslctmp/release-input/editor
          merge-multiple: true

      - name: Assemble and verify release staging directory
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          SOURCE_EPOCH: ${{ needs.preflight.outputs.source_epoch }}
        run: |
          set -euo pipefail
          python .github/scripts/release_production.py assemble \
            --tag "${RELEASE_TAG}" \
            --commit "${GITHUB_SHA}" \
            --epoch "${SOURCE_EPOCH}" \
            --generated-archive "tslctmp/release-input/generated/tsl-generated-${GITHUB_SHA}.tar.gz" \
            --docs-archive "tslctmp/release-input/docs/tsl-docs-${GITHUB_SHA}.tar.gz" \
            --editor-assets tslctmp/release-input/editor \
            --evidence-dir supplementary/release/attestations \
            --output-dir tslctmp/release-assets

      - name: Upload immutable staged set
        uses: actions/upload-artifact@v7
        with:
          name: tsl-release-staged-${{ needs.preflight.outputs.release_tag }}
          path: tslctmp/release-assets
          if-no-files-found: error

  publish:
    name: Publish verified draft exactly once
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - preflight
      - stage-release
    permissions:
      actions: read
      contents: write
    environment: release
    steps:
      - name: Check out release notes and verification policy
        uses: actions/checkout@v5

      - name: Download staged release assets
        uses: actions/download-artifact@v8
        with:
          name: tsl-release-staged-${{ needs.preflight.outputs.release_tag }}
          path: tslctmp/release-assets

      - name: Re-verify downloaded staging set
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          python .github/scripts/release_production.py verify-assets \
            --tag "${RELEASE_TAG}" \
            --directory tslctmp/release-assets

      - name: Create, upload, verify, and promote draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::release ${RELEASE_TAG} already exists; assets are immutable"
            exit 1
          fi
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            "${release_flags[@]}" \
            --title "TSL generated library ${RELEASE_TAG}" \
            --notes-file CHANGELOG.md
          mapfile -t assets < <(find tslctmp/release-assets -maxdepth 1 -type f -print | sort)
          gh release upload "${RELEASE_TAG}" "${assets[@]}"
          mkdir -p tslctmp/release-download
          gh release download "${RELEASE_TAG}" --dir tslctmp/release-download
          diff --recursive --no-dereference \
            tslctmp/release-assets \
            tslctmp/release-download
          gh release edit "${RELEASE_TAG}" --draft=false "${release_flags[@]}"
