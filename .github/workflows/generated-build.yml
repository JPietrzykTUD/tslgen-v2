name: Generated Build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tslc-generated-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute image tag
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          echo "image=ghcr.io/${owner}/${name}-tslc-ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: ./.github/actions/build-ci-image
        with:
          image: ${{ steps.image.outputs.image }}
          load: "false"
          push: "true"

  profile-shards:
    name: Compute profile shards
    runs-on: ubuntu-latest
    outputs:
      profile_shards: ${{ steps.shards.outputs.profile_shards }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute generated profile shards
        id: shards
        run: |
          profile_shards="$(
            jq -c -f .github/scripts/profile_shards.jq \
              supplementary/buildsystem/machine_profiles.json
          )"
          echo "profile_shards=${profile_shards}" >> "$GITHUB_OUTPUT"

  generated-build:
    name: Generated build (${{ matrix.profile_shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - ci-image
      - profile-shards

    strategy:
      fail-fast: false
      matrix:
        profile_shard: ${{ fromJson(needs['profile-shards'].outputs.profile_shards) }}

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-build-${{ matrix.profile_shard.name }}/docker-pull.log" \
            docker pull "${TSLC_CI_IMAGE}"

      - name: Build-verify generated output shard
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-build-${{ matrix.profile_shard.name }}/build.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_BACKENDS="${{ matrix.profile_shard.backend }}" \
              -e TSLC_PROFILES="${{ matrix.profile_shard.profiles }}" \
              -e TSLC_CI_OUTPUT="./tslctmp/ci-build-${{ matrix.profile_shard.name }}" \
              -- \
              bash -lc '
                set -e
                trap "rm -rf \"${TSLC_CI_OUTPUT}\" tslctmp/toolchain-preflight tslctmp/zig-local-cache tslctmp/zig-global-cache" EXIT
                ./dev.sh build \
                  --primitives add \
                  --backends "${TSLC_BACKENDS}" \
                  --profiles "${TSLC_PROFILES}" \
                  --output-root "${TSLC_CI_OUTPUT}"
              '

      - name: Upload generated build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-generated-build-${{ matrix.profile_shard.name }}
          path: tslctmp/ci-logs/generated-build-${{ matrix.profile_shard.name }}
          if-no-files-found: ignore
          retention-days: 14

  generated-benchmarks:
    name: Generated benchmarks (x86 policy and ARM smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - ci-image

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-benchmarks/docker-pull.log" \
            docker pull "${TSLC_CI_IMAGE}"

      - name: Build and execute generated benchmark paths
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-benchmarks/tests.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_QEMU_AARCH64="/usr/bin/qemu-aarch64" \
              -- \
              bash -lc '
                set -e
                trap "rm -rf tslctmp/pytest" EXIT
                # Keep generated Rust crates in separate pytest processes so
                # module-scoped render results are released before the next
                # rustc benchmark build starts.
                for test_target in \
                  tslc/tests/test_benchmark_variants.py \
                  tslc/tests/test_rust_benchmark_rendering.py::test_generated_rust_immediate_benchmark_runs_report_only_and_has_hot_loop \
                  tslc/tests/test_rust_benchmark_rendering.py::test_generated_rust_avx2_reductions_run_report_only_and_have_hot_loop \
                  tslc/tests/test_rust_benchmark_rendering.py::test_generated_rust_benchmark_builds_runs_and_has_hot_loop_evidence \
                  tslc/tests/test_rust_policy_consumption.py::test_generated_rust_policy_is_applied_fail_closed_and_invalidated
                do
                  PYTHONPATH=tslc/src python -m pytest -q \
                    --run-generated-builds \
                    -m generated_build \
                    "${test_target}"
                done
              '

      - name: Upload generated benchmark logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-generated-benchmarks
          path: tslctmp/ci-logs/generated-benchmarks
          if-no-files-found: ignore
          retention-days: 14
