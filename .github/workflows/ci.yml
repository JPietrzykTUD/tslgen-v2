name: TSLc CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tslc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-verify:
    name: PR verification
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e ./tslc

      - name: Run Python test suite
        run: |
          set -e
          mkdir -p tslctmp
          trap "rm -rf tslctmp/pytest" EXIT
          python -m compileall -q tslc/src/tslc
          python -m pytest -q tslc/tests \
            --ignore=tslc/tests/test_build_verify.py \
            --ignore=tslc/tests/test_value_tests.py

  ci-image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image tag
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          echo "image=ghcr.io/${owner}/${name}-tslc-ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: ./.github/actions/build-ci-image
        with:
          image: ${{ steps.image.outputs.image }}
          load: "false"
          push: "true"

  pr-consumer-check:
    name: PR generated consumer smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    needs:
      - ci-image

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}
      TSLC_CI_OUTPUT: ./tslctmp/ci-pr-generated

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${TSLC_CI_IMAGE}"

      - name: Generate small consumer-check output
        run: |
          bash supplementary/ci/run_tslc_ci_container.sh \
            -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
            -- \
            bash -lc './dev.sh generate --primitives add --profiles scalar --backends cpp,rust --output-root "${TSLC_CI_OUTPUT}"'

      - name: Verify generated consumer projects
        run: |
          bash supplementary/ci/run_tslc_ci_container.sh \
            -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
            -- \
            bash -lc 'bash supplementary/ci/verify_generated_consumers.sh "${TSLC_CI_OUTPUT}"'

      - name: Clean generated consumer output
        if: always()
        run: rm -rf "${TSLC_CI_OUTPUT}"

  profile-shards:
    name: Compute profile shards
    runs-on: ubuntu-latest
    outputs:
      profile_shards: ${{ steps.shards.outputs.profile_shards }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute generated profile shards
        id: shards
        run: |
          profile_shards="$(
            jq -c -f supplementary/ci/profile_shards.jq \
              supplementary/buildsystem/machine_profiles.json
          )"
          echo "profile_shards=${profile_shards}" >> "$GITHUB_OUTPUT"

  pr-generated-build-tests:
    name: PR generated build (${{ matrix.profile_shard.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 90
    needs:
      - ci-image
      - profile-shards

    strategy:
      fail-fast: false
      matrix:
        profile_shard: ${{ fromJson(needs['profile-shards'].outputs.profile_shards) }}

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${TSLC_CI_IMAGE}"

      - name: Build-verify generated output shard
        run: |
          bash supplementary/ci/run_tslc_ci_container.sh \
            -e TSLC_BACKENDS="cpp,rust" \
            -e TSLC_PROFILES="${{ matrix.profile_shard.profiles }}" \
            -e TSLC_CI_OUTPUT="./tslctmp/ci-pr-build-${{ matrix.profile_shard.name }}" \
            -- \
            bash -lc '
              set -e
              trap "rm -rf \"${TSLC_CI_OUTPUT}\" tslctmp/toolchain-preflight tslctmp/zig-local-cache tslctmp/zig-global-cache" EXIT
              ./dev.sh build \
                --primitives add \
                --backends "${TSLC_BACKENDS}" \
                --profiles "${TSLC_PROFILES}" \
                --output-root "${TSLC_CI_OUTPUT}"
            '

  full-python-tests:
    name: Full Python tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e ./tslc

      - name: Run Python test suite
        run: |
          set -e
          mkdir -p tslctmp
          trap "rm -rf tslctmp/pytest" EXIT
          python -m compileall -q tslc/src/tslc
          python -m pytest -q tslc/tests \
            --ignore=tslc/tests/test_build_verify.py \
            --ignore=tslc/tests/test_value_tests.py

  full-generated-value-tests:
    name: Generated value tests (${{ matrix.backend }} / ${{ matrix.profile_shard.name }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 120
    needs:
      - ci-image
      - profile-shards

    strategy:
      fail-fast: false
      matrix:
        backend: [cpp, rust]
        profile_shard: ${{ fromJson(needs['profile-shards'].outputs.profile_shards) }}

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${TSLC_CI_IMAGE}"

      - name: Run generated value-test shard
        run: |
          bash supplementary/ci/run_tslc_ci_container.sh \
            -e TSLC_BACKENDS="${{ matrix.backend }}" \
            -e TSLC_PROFILES="${{ matrix.profile_shard.profiles }}" \
            -e TSLC_CI_OUTPUT="./tslctmp/ci-value-${{ matrix.backend }}-${{ matrix.profile_shard.name }}" \
            -- \
            bash -lc '
              set -e
              trap "rm -rf \"${TSLC_CI_OUTPUT}\" tslctmp/toolchain-preflight tslctmp/zig-local-cache tslctmp/zig-global-cache" EXIT
              ./dev.sh test \
                --backends "${TSLC_BACKENDS}" \
                --profiles "${TSLC_PROFILES}" \
                --output-root "${TSLC_CI_OUTPUT}"
            '

  package-generated-output:
    name: Package generated output
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    needs:
      - ci-image
      - full-python-tests
      - full-generated-value-tests

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}
      TSLC_CI_OUTPUT: ./tslctmp/ci-generated

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${TSLC_CI_IMAGE}"

      - name: Generate package output
        run: |
          bash supplementary/ci/run_tslc_ci_container.sh \
            -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
            -- \
            bash -lc './dev.sh generate --test --value-test-warnings --backends cpp,rust --output-root "${TSLC_CI_OUTPUT}"'

      - name: Verify generated consumer projects
        run: |
          bash supplementary/ci/run_tslc_ci_container.sh \
            -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
            -- \
            bash -lc 'bash supplementary/ci/verify_generated_consumers.sh "${TSLC_CI_OUTPUT}"'

      - name: Package generated output
        run: |
          mkdir -p tslctmp/artifacts
          tar -C "${TSLC_CI_OUTPUT}" -czf "tslctmp/artifacts/tsl-generated-${GITHUB_SHA}.tar.gz" .

      - name: Upload generated artifact package
        uses: actions/upload-artifact@v4
        with:
          name: tsl-generated-${{ github.sha }}
          path: tslctmp/artifacts/tsl-generated-${{ github.sha }}.tar.gz
          if-no-files-found: error
