name: Generated Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tslc-generated-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine CI scope
    uses: ./.github/workflows/ci-scope.yml

  ci-image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - scope
    if: needs.scope.outputs.package == 'true' || needs.scope.outputs.docs == 'true'
    concurrency:
      group: tslc-ci-image-${{ needs.scope.outputs.ci_image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: ./.github/actions/build-ci-image
        with:
          image: ${{ needs.scope.outputs.ci_image }}
          load: "false"
          push: "true"
          reuse-existing: "true"

  package-generated-output:
    name: Package generated output
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - scope
      - ci-image
    if: needs.scope.outputs.package == 'true' || needs.scope.outputs.docs == 'true'
    permissions:
      contents: write
      packages: read

    env:
      TSLC_CI_IMAGE: ${{ needs.scope.outputs.ci_image }}
      TSLC_CI_OUTPUT: ./tslctmp/ci-generated

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/docker-pull.log" \
            docker pull "${TSLC_CI_IMAGE}"

      - name: Generate package output
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/generate.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
              -- \
              bash -lc \
                'bash .github/scripts/generate_distributable_project.sh "${TSLC_CI_OUTPUT}"'

      - name: Verify generated consumers and examples
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/verify-consumers.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
              -- \
              bash -lc 'bash supplementary/ci/verify_generated_consumers.sh "${TSLC_CI_OUTPUT}"'

      - name: Package generated output
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/package.log" \
            bash -lc '
              set -e
              mkdir -p tslctmp/artifacts
              tar -C "${TSLC_CI_OUTPUT}" -czf "tslctmp/artifacts/tsl-generated-${GITHUB_SHA}.tar.gz" .
            '

      - name: Upload generated artifact package
        uses: actions/upload-artifact@v7
        with:
          name: tsl-generated-${{ github.sha }}
          path: tslctmp/artifacts/tsl-generated-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Publish generated release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_PATH: tslctmp/artifacts/tsl-generated-${{ github.sha }}.tar.gz
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/release.log" \
            bash -lc '
              set -e
              release_title="TSL generated ${RELEASE_TAG}"
              release_notes="Generated TSL package for ${RELEASE_TAG} (${GITHUB_SHA})."
              asset_name="tsl-generated-${RELEASE_TAG}.tar.gz"
              release_asset_path="tslctmp/artifacts/${asset_name}"
              cp "${ASSET_PATH}" "${release_asset_path}"

              if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                if ! gh release create "${RELEASE_TAG}" \
                  --title "${release_title}" \
                  --notes "${release_notes}" \
                  --verify-tag; then
                  gh release view "${RELEASE_TAG}" >/dev/null
                fi
              fi

              gh release upload \
                "${RELEASE_TAG}" \
                "${release_asset_path}" \
                --clobber
            '

      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-generated-package
          path: tslctmp/ci-logs/generated-package
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Build docs from packaged output
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - scope
      - ci-image
      - package-generated-output
    if: needs.scope.outputs.docs == 'true'
    permissions:
      contents: read
      packages: read
      pages: write

    env:
      TSLC_CI_IMAGE: ${{ needs.scope.outputs.ci_image }}
      TSLC_CI_OUTPUT: ./tslctmp/ci-docs

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download generated package
        uses: actions/download-artifact@v8
        with:
          name: tsl-generated-${{ github.sha }}
          path: tslctmp/docs-input

      - name: Extract generated package
        run: |
          mkdir -p "${TSLC_CI_OUTPUT}"
          tar -xzf "tslctmp/docs-input/tsl-generated-${GITHUB_SHA}.tar.gz" \
            -C "${TSLC_CI_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/docs/docker-pull.log" \
            docker pull "${TSLC_CI_IMAGE}"

      - name: Build generated documentation
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/docs/build-docs.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
              -- \
              bash -lc '
                set -e
                trap "rm -rf tslctmp/toolchain-preflight tslctmp/zig-local-cache tslctmp/zig-global-cache" EXIT
                PYTHONPATH=tslc/src python -m tslc.maintenance.documentation \
                  --output-root "${TSLC_CI_OUTPUT}" \
                  --backends cpp,rust
              '

      - name: Package docs site
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/docs/package.log" \
            bash -lc '
              set -e
              mkdir -p tslctmp/artifacts
              tar -C "${TSLC_CI_OUTPUT}/docs/site" -czf "tslctmp/artifacts/tsl-docs-${GITHUB_SHA}.tar.gz" .
            '

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: tsl-docs-${{ github.sha }}
          path: tslctmp/artifacts/tsl-docs-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.TSLC_CI_OUTPUT }}/docs/site

      - name: Upload docs logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-docs
          path: tslctmp/ci-logs/docs
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs:
      - docs
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
