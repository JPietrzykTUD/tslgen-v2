name: Generated Package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: tslc-generated-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-image:
    name: Build CI image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute image tag
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          echo "image=ghcr.io/${owner}/${name}-tslc-ci:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: ./.github/actions/build-ci-image
        with:
          image: ${{ steps.image.outputs.image }}
          load: "false"
          push: "true"

  package-generated-output:
    name: Package generated output
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - ci-image
    permissions:
      contents: write
      packages: read

    env:
      TSLC_CI_IMAGE: ${{ needs['ci-image'].outputs.image }}
      TSLC_CI_OUTPUT: ./tslctmp/ci-generated

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/docker-pull.log" \
            docker pull "${TSLC_CI_IMAGE}"

      - name: Generate package output
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/generate.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
              -- \
              bash -lc './dev.sh generate --backends cpp,rust --output-root "${TSLC_CI_OUTPUT}"'

      - name: Verify generated consumers and examples
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/verify-consumers.log" \
            bash supplementary/ci/run_tslc_ci_container.sh \
              -e TSLC_CI_OUTPUT="${TSLC_CI_OUTPUT}" \
              -- \
              bash -lc 'bash supplementary/ci/verify_generated_consumers.sh "${TSLC_CI_OUTPUT}"'

      - name: Package generated output
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/package.log" \
            bash -lc '
              set -e
              mkdir -p tslctmp/artifacts
              tar -C "${TSLC_CI_OUTPUT}" -czf "tslctmp/artifacts/tsl-generated-${GITHUB_SHA}.tar.gz" .
            '

      - name: Upload generated artifact package
        uses: actions/upload-artifact@v7
        with:
          name: tsl-generated-${{ github.sha }}
          path: tslctmp/artifacts/tsl-generated-${{ github.sha }}.tar.gz
          if-no-files-found: error

      - name: Publish generated release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET_PATH: tslctmp/artifacts/tsl-generated-${{ github.sha }}.tar.gz
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/generated-package/release.log" \
            bash -lc '
              set -e
              release_title="TSL generated ${RELEASE_TAG}"
              release_notes="Generated TSL package for ${RELEASE_TAG} (${GITHUB_SHA})."
              asset_name="tsl-generated-${RELEASE_TAG}.tar.gz"
              release_asset_path="tslctmp/artifacts/${asset_name}"
              cp "${ASSET_PATH}" "${release_asset_path}"

              if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
                if ! gh release create "${RELEASE_TAG}" \
                  --title "${release_title}" \
                  --notes "${release_notes}" \
                  --verify-tag; then
                  gh release view "${RELEASE_TAG}" >/dev/null
                fi
              fi

              gh release upload \
                "${RELEASE_TAG}" \
                "${release_asset_path}" \
                --clobber
            '

      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-generated-package
          path: tslctmp/ci-logs/generated-package
          if-no-files-found: ignore
          retention-days: 14
