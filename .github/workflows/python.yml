name: Python Logic

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tslc-python-logic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine CI scope
    uses: ./.github/workflows/ci-scope.yml

  python-type-check:
    name: Python type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - scope
    if: needs.scope.outputs.python_type_check == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e ./tslc

      - name: Run incremental type check
        working-directory: tslc
        run: python -m mypy

  pivot-tests:
    name: PIVOT tool tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - scope
    if: needs.scope.outputs.pivot == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml
            tools/pivot/pyproject.toml

      - name: Install PIVOT test dependencies
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/pivot/install.log" \
            bash -lc '
              set -e
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pip install --no-deps -e ./tslc
              python -m pip install --no-deps -e ./tools/pivot
            '

      - name: Build and inspect isolated wheels
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/pivot/wheels.log" \
            bash -lc '
              set -e
              mkdir -p \
                tslctmp/pivot-rework/wheel-sources \
                tslctmp/pivot-rework/wheels/core \
                tslctmp/pivot-rework/wheels/tool
              cp -R \
                ./tslc \
                tslctmp/pivot-rework/wheel-sources/tslc
              cp -R \
                ./tools/pivot \
                tslctmp/pivot-rework/wheel-sources/pivot
              python -m pip wheel \
                --no-deps \
                tslctmp/pivot-rework/wheel-sources/tslc \
                --wheel-dir tslctmp/pivot-rework/wheels/core
              python -m pip wheel \
                --no-deps \
                tslctmp/pivot-rework/wheel-sources/pivot \
                --wheel-dir tslctmp/pivot-rework/wheels/tool
              python tools/pivot/scripts/check_wheel_isolation.py \
                --core-wheel tslctmp/pivot-rework/wheels/core/*.whl \
                --tool-wheel tslctmp/pivot-rework/wheels/tool/*.whl
            '

      - name: Run PIVOT type and logic tests
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/pivot/tests.log" \
            bash -lc '
              set -e
              mkdir -p tslctmp
              trap "rm -rf tslctmp/pivot-pytest" EXIT
              python -m compileall -q tools/pivot/src/tslc_pivot
              (cd tools/pivot && python -m mypy)
              tslc --help
              tslc-pivot --help
              python -m tslc_pivot --help
              python -m pytest -q tools/pivot/tests
            '

      - name: Upload PIVOT test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-pivot
          path: tslctmp/ci-logs/pivot
          if-no-files-found: ignore
          retention-days: 14

  python-test-shards:
    name: Compute Python test shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - scope
    if: needs.scope.outputs.python_tests == 'true'
    outputs:
      python_test_shards: ${{ steps.shards.outputs.python_test_shards }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Compute Python test shards
        id: shards
        env:
          CI_PYTHON_FULL: ${{ needs.scope.outputs.python_full }}
          CI_CHANGED_PYTHON_TESTS: ${{ needs.scope.outputs.changed_python_tests }}
        run: |
          if [[ "${CI_PYTHON_FULL}" == "true" ]]; then
            python_test_shards="$(python3 .github/scripts/python_test_shards.py)"
          else
            python_test_shards="$(
              python3 .github/scripts/python_test_shards.py \
                --count 1 \
                --paths-json "${CI_CHANGED_PYTHON_TESTS}"
            )"
          fi
          echo "python_test_shards=${python_test_shards}" >> "$GITHUB_OUTPUT"

  python-tests:
    name: Python tests (${{ matrix.python_test_shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - scope
      - python-test-shards
    if: needs.scope.outputs.python_tests == 'true'

    strategy:
      fail-fast: false
      matrix:
        python_test_shard: ${{ fromJson(needs['python-test-shards'].outputs.python_test_shards) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Install Python test dependencies
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/python-${{ matrix.python_test_shard.name }}/install.log" \
            bash -lc '
              set -e
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pip install --no-deps -e ./tslc
            '

      - name: Run Python test suite
        env:
          CI_PYTHON_TEST_PATHS: ${{ matrix.python_test_shard.paths_json }}
        run: |
          bash .github/scripts/run_with_log.sh \
            "tslctmp/ci-logs/python-${{ matrix.python_test_shard.name }}/tests.log" \
            bash -lc '
              set -e
              mkdir -p tslctmp
              trap "rm -rf tslctmp/pytest" EXIT
              python -m compileall -q tslc/src/tslc
              python -c "import json, os, subprocess, sys; raise SystemExit(subprocess.call((sys.executable, \"-m\", \"pytest\", \"-q\", *json.loads(os.environ[\"CI_PYTHON_TEST_PATHS\"]))))"
            '

      - name: Upload Python test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-python-${{ matrix.python_test_shard.name }}
          path: tslctmp/ci-logs/python-${{ matrix.python_test_shard.name }}
          if-no-files-found: ignore
          retention-days: 14

  required-python:
    name: Required Python CI
    runs-on: ubuntu-latest
    needs:
      - scope
      - python-type-check
      - pivot-tests
      - python-test-shards
      - python-tests
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify selected jobs passed
        run: |
          bash .github/scripts/require_ci_results.sh \
            scope true "${{ needs.scope.result }}" \
            python-type-check "${{ needs.scope.outputs.python_type_check }}" "${{ needs['python-type-check'].result }}" \
            pivot-tests "${{ needs.scope.outputs.pivot }}" "${{ needs['pivot-tests'].result }}" \
            python-test-shards "${{ needs.scope.outputs.python_tests }}" "${{ needs['python-test-shards'].result }}" \
            python-tests "${{ needs.scope.outputs.python_tests }}" "${{ needs['python-tests'].result }}"
