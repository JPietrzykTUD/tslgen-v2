name: TSL Editor

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tslc-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine CI scope
    uses: ./.github/workflows/ci-scope.yml

  editor-tests:
    name: Client, LSP, and VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - scope
    if: needs.scope.outputs.editor_tests == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tslc/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-tsl/package-lock.json

      - name: Install editor test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e './tslc[editor]'

      - name: Run editor-neutral LSP tests
        run: python -m pytest -q tslc/tests/test_authoring_check.py tslc/tests/test_lsp_*.py

      - name: Install client dependencies
        working-directory: editors/vscode-tsl
        run: npm ci

      - name: Run client tests and package VSIX
        working-directory: editors/vscode-tsl
        run: npm run package

      - name: Run real VS Code extension-host test
        working-directory: editors/vscode-tsl
        run: xvfb-run -a npm run test:integration

      - name: Upload contributor-preview VSIX
        uses: actions/upload-artifact@v7
        with:
          name: tsl-language-support-contributor-preview
          path: tslctmp/tsl-language-support.vsix
          if-no-files-found: error
          retention-days: 14

  runtime-packages:
    name: Runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs:
      - scope
    if: needs.scope.outputs.editor_runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-22.04
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          - target: win32-x64
            runner: windows-2022
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            editors/vscode-tsl/runtime-requirements.txt
            tslc/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode-tsl/package-lock.json

      - name: Install frozen-runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r editors/vscode-tsl/runtime-requirements.txt
          python -m pip install --no-deps -e ./tslc

      - name: Install client dependencies
        working-directory: editors/vscode-tsl
        run: npm ci

      - name: Build, smoke-test, and package platform VSIX
        working-directory: editors/vscode-tsl
        run: npm run package:runtime

      - name: Run bundled extension-host integration test
        if: matrix.target == 'linux-x64'
        working-directory: editors/vscode-tsl
        env:
          TSL_EXPECT_SERVER_SOURCE: bundled
        run: xvfb-run -a npm run test:integration

      - name: Upload platform VSIX
        uses: actions/upload-artifact@v7
        with:
          name: tsl-language-support-${{ matrix.target }}
          path: |
            tslctmp/tsl-language-support-${{ matrix.target }}.vsix
            tslctmp/tsl-language-support-${{ matrix.target }}.vsix.sha256
          if-no-files-found: error
          retention-days: 14

  required-editor:
    name: Required editor CI
    runs-on: ubuntu-latest
    needs:
      - scope
      - editor-tests
      - runtime-packages
    if: always()
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify selected jobs passed
        run: |
          bash .github/scripts/require_ci_results.sh \
            scope true "${{ needs.scope.result }}" \
            editor-tests "${{ needs.scope.outputs.editor_tests }}" "${{ needs['editor-tests'].result }}" \
            runtime-packages "${{ needs.scope.outputs.editor_runtime }}" "${{ needs['runtime-packages'].result }}"
