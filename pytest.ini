[pytest]
# tslc is the active line; tslgen/tslgenold/frozen are reference-only and are
# not collected. (Running `pytest tslc/tests` also works and uses tslc/pyproject.toml.)
testpaths = tslc/tests
pythonpath = tslc/src
# Keep scratch on the workspace (9p host mount), not /tmp: on this WSL container
# /tmp is the overlay, which only grows the VHDX and never shrinks.
addopts = --basetemp=tslctmp/pytest
