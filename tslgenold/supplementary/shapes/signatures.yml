rules:
  # default vector instruction signatures
  - signature: v:=(s)
    attributes: []
    cases:
      template: scalar_to_vector
  - signature: v:=(s...)
    attributes: []
    cases:
      template: pack_to_vector
  - signature: v:=(s[])
    attributes: []
    cases:
      template: from_array
  - signature: v:=(sequence)
    attributes: []
    cases:
      template: sequence
  - signature: v:=(s,s)
    attributes: []
    cases:
      template: custom_sequence
  - signature: v:=(ptr+)
    attributes: []
    cases:
      template: load_convert_up
  - signature: v:=()
    attributes:
      - name: value
        values: ["undef", "zero"]
        default: "zero"
    cases:
      - template: init_vector
  - signature: v:=(ptr)
    attributes: []
    cases:
      template: load_vector
  - signature: void:=(ptr,v)
    attributes: []
    cases:
      template: store_vector
  - signature: v:=(m,ptr)
    attributes:
      - name: op
        values: ["expand", "keep"]
        default: keep
    cases:
      - template: masked_load_vector
  - signature: v:=(m,ptr,v)
    attributes:
      - name: op
        values: ["expand", "keep"]
        default: keep
    cases:
      - template: masked_load_merge_vector
  - signature: void:=(m,ptr,v)
    attributes:
      - name: op
        values: ["pack", "keep"]
        default: keep
    cases:
      - template: masked_store_vector
  - signature: v:=(ptr,vidx,sImm)
    attributes: []
    cases:
      template: gather
  - signature: v:=(m,ptr,vidx,sImm)
    attributes: []
    cases:
      - template: masked_gather
  - signature: v:=(m,ptr,vidx,v,sImm)
    attributes: []
    cases:
      - template: masked_gather_merge
  - signature: void:=(ptr,vidx,v,sImm)
    attributes: []
    cases:
      - template: scatter
  - signature: void:=(m,ptr,vidx,v,sImm)
    attributes: []
    cases:
      - template: masked_scatter
  - signature: v:=(v,v)
    attributes: []
    cases:
      - template: binary
  - signature: v:=(v,v,sImm)
    attributes:
      - name: cast
        values: ["reinterpret"]
    cases:
      - when:
          cast: reinterpret
        template: binary_with_control_imm
  - signature: v:=(m,v,v)
    attributes: []
    cases:
      - template: masked_binary
  - signature: v:=(m,v,v,v)
    attributes: []
    cases:
      - template: masked_ternary
  - signature: v:=(v)
    attributes:
      - name: cast
        values: ["reinterpret", "convert"]
    cases:
      - when:
          cast: reinterpret
        template: reinterpret
      - when:
          cast: convert
        template: convert
      - template: unary
  - signature: v:=(m,v)
    attributes:
      - name: mask
        values: ["pass_through", "zero"]
      - name: op
        values: ["expand", "pack", "keep"]
        default: "keep"
    cases:
      - when:
          mask: pass_through
        template: masked_unary
      - when:
          mask: zero
          op: expand
        template: expand
      - when:
          mask: zero
          op: pack
        template: pack
      - when:
          mask: zero
          op: keep
        template: masked_unary
  - signature: v:=(m,v,s)
    attributes: []
    cases:
      - template: masked_binary_scalar
  - signature: v:=(m,v,sImm)
    attributes: []
    cases:
      - template: masked_binary_scalar_with_control_imm
  - signature: v:=(v,v,vidx)
    attributes: []
    cases:
      template: shuffle
  - signature: v:=(v,sImm)
    attributes:
      - name: cast
        values: ["reinterpret", "convert", "none"]
        default: none
      - name: direction
        values: ["up", "down", "none"]
        default: none
    cases:
      - when:
          cast: convert
          direction: up
          template: convert_up
      - when:
          cast: convert
          direction: down
          template: convert_down
      - when:
          cast: reinterpret
          template: extract
      - template: unary_with_control_imm
  - signature: v:=(v,s)
    attributes: []
    cases:
      - template: binary_scalar
  # default mask producing instruction signatures
  - signature: m:=(ptr)
    attributes: []
    cases:
      template: load_mask
  - signature: void:=(ptr,m)
    attributes: []
    cases:
      template: store_mask
  - signature: m:=(v,v)
    attributes: []
    cases:
      - template: binary_compare
  - signature: m:=(v,v,v)
    attributes: []
    cases:
      - template: ternary_compare
  - signature: m:=(m,v,v)
    attributes: []
    cases:
      - template: masked_binary_compare
  - signature: m:=(m,v,v,v)
    attributes: []
    cases:
      - template: masked_ternary_compare
  - signature: s:=(m)
    attributes: []
    cases:
      template: mask_to_scalar
  - signature: m:=(s)
    attributes: []
    cases:
      template: scalar_to_mask
  - signature: v:=(m)
    attributes: []
    cases:
      template: mask_to_vector
  - signature: m:=(m,m)
    attributes: []
    cases:
      - template: mask_binary
  - signature: m:=()
    attributes:
      - name: value
        values: ["zero", "all"]
    cases:
      - template: mask_set
  - signature: m:=(v)
    attributes:
      - name: value
        values: ["zero"]
    cases:
      template: compare_with_zero
  - signature: m:=(m,s)
    attributes: []
    cases:
      template: mask_with_scalar
  - signature: m:=(m,v)
    attributes: []
    cases:
      template: mask_with_vector
  ###
  - signature: s:=(ptr)
    attributes: []
    cases:
      template: load_scalar
  - signature: void:=(ptr,s)
    attributes: []
    cases:
      template: store_scalar
  - signature: s:=(v)
    attributes: []
    cases:
      template: reduce
  - signature: s[]:=(v)
    attributes: []
    cases:
      template: to_array
  - signature: s:=(v[idx])
    attributes: []
    cases:
      template: extract_value
  - signature: s:=(m,v)
    attributes: []
    cases:
      template: masked_reduce
  - signature: s:=(v,s)
    attributes: []
    cases:
      template: binary_scalar_reduce
  - signature: s:=(s)
    attributes: []
    cases:
      template: unary_scalar
  - signature: m:=(m)
    attributes: []
    cases:
      template: unary_mask
  - signature: s:=(s,s)
    attributes: []
    cases:
      template: binary_scalar
  - signature: s:=(s,s,s)
    attributes: []
    cases:
      template: ternary_scalar
  # memory
  - signature: ptr:=(s)
    attributes: []
    cases:
      template: alloc
  - signature: ptr:=(s,s)
    attributes: []
    cases:
      template: alloc_aligned
  - signature: void:=(ptr)
    attributes: []
    cases:
      template: dealloc
  - signature: void:=(ptr,ptr,s,s)
    attributes: []
    cases:
      template: memcpy
  #
  - signature: o:=(o,v,s)
    attributes: []
    cases:
      template: ostream